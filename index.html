<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>تسجيل حالة المعدات والأصول - شموع الماضي</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f2942">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0f2942;
    --navy-2:#163a5c;
    --gold:#c8952c;
    --bg:#f4f6f9;
    --card:#ffffff;
    --text:#1c2b3a;
    --muted:#6b7c8e;
    --border:#e1e6ec;
    --danger:#c0392b;
    --ok:#1e8e5a;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Cairo',sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    padding-bottom:40px;
  }
  header{
    background:linear-gradient(135deg,var(--navy),var(--navy-2));
    color:#fff;
    padding:18px 18px 24px;
    border-bottom:4px solid var(--gold);
  }
  .header-row{display:flex;align-items:center;justify-content:center;gap:14px;max-width:560px;margin:0 auto;}
  .header-row img{width:56px;height:56px;border-radius:12px;background:#fff;padding:4px;flex-shrink:0;}
  .header-text{text-align:center;}
  header h1{margin:0;font-size:18px;font-weight:800;}
  header p{margin:4px 0 0;font-size:13px;color:#cdd9e6;font-weight:400;}
  main{max-width:560px;margin:-16px auto 0;padding:0 14px;}
  footer{max-width:560px;margin:6px auto 0;padding:10px 14px 0;text-align:center;}
  footer p{margin:0;font-size:12px;color:var(--muted);}
  .card{
    background:var(--card);
    border-radius:var(--radius);
    padding:20px 18px;
    box-shadow:0 6px 20px rgba(15,41,66,.08);
    margin-bottom:16px;
  }
  label{
    display:block;
    font-weight:700;
    font-size:14px;
    margin-bottom:8px;
    color:var(--navy);
  }
  .field{margin-bottom:18px;}
  input[type=text], textarea{
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--border);
    border-radius:10px;
    font-family:'Cairo',sans-serif;
    font-size:15px;
    background:#fbfcfd;
    transition:border-color .15s;
  }
  input[type=text]:focus, textarea:focus{
    outline:none;
    border-color:var(--navy-2);
    background:#fff;
  }
  textarea{min-height:90px;resize:vertical;}
  .status-options{display:flex;flex-direction:column;gap:10px;}
  .status-option{
    display:flex;
    align-items:flex-start;
    gap:10px;
    border:1.5px solid var(--border);
    border-radius:10px;
    padding:12px 14px;
    cursor:pointer;
    transition:all .15s;
  }
  .status-option input{margin-top:3px;accent-color:var(--navy);width:18px;height:18px;flex-shrink:0;}
  .status-option span{font-size:14px;line-height:1.5;}
  .status-option.checked{border-color:var(--navy-2);background:#eef4fa;}
  .photo-zone{
    border:2px dashed var(--border);
    border-radius:12px;
    padding:22px 14px;
    text-align:center;
    cursor:pointer;
    background:#fbfcfd;
  }
  .photo-zone:hover{border-color:var(--navy-2);}
  .photo-zone svg{width:34px;height:34px;color:var(--navy-2);}
  .photo-zone p{margin:8px 0 0;font-size:13px;color:var(--muted);}
  input[type=file]{display:none;}
  .thumbs{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;}
  .thumb{
    position:relative;width:78px;height:78px;border-radius:10px;overflow:hidden;border:1.5px solid var(--border);
  }
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .thumb button{
    position:absolute;top:2px;left:2px;background:rgba(192,57,43,.92);color:#fff;border:none;
    width:20px;height:20px;border-radius:50%;font-size:13px;line-height:1;cursor:pointer;
  }
  button.submit{
    width:100%;
    padding:15px;
    background:var(--navy);
    color:#fff;
    border:none;
    border-radius:12px;
    font-family:'Cairo',sans-serif;
    font-size:16px;
    font-weight:800;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  button.submit:disabled{background:#9fb0bf;cursor:not-allowed;}
  .hint{font-size:12px;color:var(--muted);margin-top:6px;}
  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--ok);color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;
    box-shadow:0 6px 16px rgba(0,0,0,.15);opacity:0;transition:opacity .25s;pointer-events:none;z-index:50;
    text-align:center;max-width:90%;
  }
  .toast.error{background:var(--danger);}
  .toast.show{opacity:1;}
  .success-screen{text-align:center;padding:40px 20px;}
  .success-screen .check{
    width:64px;height:64px;border-radius:50%;background:#e5f6ed;color:var(--ok);
    display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:32px;
  }
  .success-screen h2{margin:0 0 8px;color:var(--navy);}
  .success-screen p{color:var(--muted);margin:0 0 22px;font-size:14px;}
  .link-btn{background:transparent;border:1.5px solid var(--navy);color:var(--navy);border-radius:10px;padding:10px 18px;font-family:'Cairo',sans-serif;font-weight:700;cursor:pointer;}
  .spinner{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<header>
  <div class="header-row">
    <img src="icons/logo.png" alt="شعار شركة شموع الماضي">
    <div class="header-text">
      <h1>شركة شموع الماضي</h1>
      <p>تسجيل حالة المعدات والأصول</p>
    </div>
  </div>
</header>

<main>
  <div class="card" id="formCard">
    <form id="reportForm" novalidate>
      <div class="field">
        <label for="employeeName">اسم الموظف</label>
        <input type="text" id="employeeName" placeholder="اكتب اسمك" required>
      </div>

      <div class="field">
        <label for="siteName">اسم الموقع</label>
        <input type="text" id="siteName" placeholder="اسم الفرع / المصنع / المخزن" required>
      </div>

      <div class="field">
        <label for="assetName">اسم المعدة أو الأصل</label>
        <input type="text" id="assetName" placeholder="مثال: رافعة شوكية، ماكينة تعبئة..." required>
      </div>

      <div class="field">
        <label>حالة المعدة / الأصل</label>
        <div class="status-options" id="statusOptions">
          <label class="status-option">
            <input type="radio" name="status" value="صالحة ويستخدمها الموقع بصورة غير منتظمة" required>
            <span>صالحة، والموقع يستخدمها بصورة غير منتظمة</span>
          </label>
          <label class="status-option">
            <input type="radio" name="status" value="صالحة والموقع ليس في حاجة إليها">
            <span>صالحة، والموقع ليس في حاجة إليها</span>
          </label>
          <label class="status-option">
            <input type="radio" name="status" value="تحتاج صيانة ويُعاد استخدامها بالموقع">
            <span>تحتاج صيانة ويُعاد استخدامها بالموقع</span>
          </label>
          <label class="status-option">
            <input type="radio" name="status" value="غير صالحة للاستخدام">
            <span>غير صالحة للاستخدام</span>
          </label>
        </div>
      </div>

      <div class="field">
        <label for="notes">ملاحظات</label>
        <textarea id="notes" placeholder="أي ملاحظات إضافية، أو لو فيه معدة/أصل محتاجينه في الموقع مش موجود اكتبه هنا"></textarea>
      </div>

      <div class="field">
        <label>الصور</label>
        <div class="photo-zone" id="photoZone">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 16V4m0 0L7 9m5-5l5 5"/><rect x="4" y="16" width="16" height="4" rx="1"/></svg>
          <p>اضغط هنا لرفع صورة أو أكتر (ممكن تختار عدة صور مرة واحدة)</p>
        </div>
        <input type="file" id="photoInput" accept="image/*" multiple capture="environment">
        <div class="thumbs" id="thumbs"></div>
      </div>

      <button type="submit" class="submit" id="submitBtn">
        <span id="submitLabel">إرسال التقرير</span>
      </button>
    </form>
  </div>

  <div class="card success-screen" id="successCard" style="display:none;">
    <div class="check">✓</div>
    <h2>تم إرسال التقرير بنجاح</h2>
    <p>شكراً لك، تم تسجيل البيانات والصور بنجاح.</p>
    <button class="link-btn" id="newReportBtn">تسجيل تقرير جديد</button>
  </div>
</main>

<footer>
  <p>تصميم أحمد طه — مكتب نائب الرئيس التنفيذي</p>
</footer>

<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script>
const form = document.getElementById('reportForm');
const photoZone = document.getElementById('photoZone');
const photoInput = document.getElementById('photoInput');
const thumbsWrap = document.getElementById('thumbs');
const submitBtn = document.getElementById('submitBtn');
const submitLabel = document.getElementById('submitLabel');
const toast = document.getElementById('toast');
const formCard = document.getElementById('formCard');
const successCard = document.getElementById('successCard');
const newReportBtn = document.getElementById('newReportBtn');

let selectedFiles = [];

document.querySelectorAll('.status-option').forEach(function(opt){
  opt.addEventListener('click', function(){
    document.querySelectorAll('.status-option').forEach(function(o){o.classList.remove('checked');});
    opt.classList.add('checked');
  });
});

photoZone.addEventListener('click', function(){ photoInput.click(); });

photoInput.addEventListener('change', function(e){
  Array.from(e.target.files).forEach(function(file){
    selectedFiles.push(file);
    renderThumb(file);
  });
  photoInput.value = '';
});

function renderThumb(file){
  const reader = new FileReader();
  reader.onload = function(ev){
    const div = document.createElement('div');
    div.className = 'thumb';
    const img = document.createElement('img');
    img.src = ev.target.result;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = '×';
    btn.onclick = function(){
      selectedFiles = selectedFiles.filter(function(f){ return f !== file; });
      div.remove();
    };
    div.appendChild(img);
    div.appendChild(btn);
    thumbsWrap.appendChild(div);
  };
  reader.readAsDataURL(file);
}

function showToast(msg, isError){
  toast.textContent = msg;
  toast.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(function(){ toast.className = 'toast'; }, 3200);
}

// بيضغط الصورة (تصغير أقصى بعد وتقليل الجودة) قبل ما يبعتها، عشان السرعة والمساحة
const MAX_DIMENSION = 1600;   // أقصى عرض/ارتفاع بالبكسل
const JPEG_QUALITY = 0.72;    // جودة الضغط (0 إلى 1)

function compressImage(file){
  return new Promise(function(resolve, reject){
    if(!file.type || file.type.indexOf('image/') !== 0){
      // مش صورة (نادراً ما يحصل بسبب accept="image/*")، ابعتها زي ما هي
      fileToBase64(file).then(function(b64){
        resolve({ data: b64, mimeType: file.type || 'application/octet-stream', filename: file.name });
      }).catch(reject);
      return;
    }
    const img = new Image();
    const reader = new FileReader();
    reader.onload = function(ev){
      img.onload = function(){
        let w = img.width, h = img.height;
        if(w > MAX_DIMENSION || h > MAX_DIMENSION){
          if(w >= h){ h = Math.round(h * MAX_DIMENSION / w); w = MAX_DIMENSION; }
          else { w = Math.round(w * MAX_DIMENSION / h); h = MAX_DIMENSION; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        const dataUrl = canvas.toDataURL('image/jpeg', JPEG_QUALITY);
        resolve({
          data: dataUrl.split(',')[1],
          mimeType: 'image/jpeg',
          filename: file.name.replace(/\.[^.]+$/, '') + '.jpg'
        });
      };
      img.onerror = function(){ reject(new Error('تعذرت معالجة الصورة')); };
      img.src = ev.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function fileToBase64(file){
  return new Promise(function(resolve, reject){
    const reader = new FileReader();
    reader.onload = function(){ resolve(reader.result.split(',')[1]); };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

form.addEventListener('submit', async function(e){
  e.preventDefault();

  const employeeName = document.getElementById('employeeName').value.trim();
  const siteName = document.getElementById('siteName').value.trim();
  const assetName = document.getElementById('assetName').value.trim();
  const statusEl = document.querySelector('input[name=status]:checked');
  const notes = document.getElementById('notes').value.trim();

  if(!employeeName || !siteName || !assetName || !statusEl){
    showToast('من فضلك أكمل كل الحقول المطلوبة (الاسم، الموقع، المعدة، الحالة)', true);
    return;
  }

  if(!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf('PUT_YOUR') === 0){
    showToast('لسه لازم تحط رابط الـ Apps Script في ملف config.js', true);
    return;
  }

  submitBtn.disabled = true;
  submitLabel.innerHTML = selectedFiles.length ? 'جارِ ضغط الصور وإرسالها...' : 'جارِ الإرسال...';
  submitBtn.insertAdjacentHTML('beforeend', '<span class="spinner" style="margin-right:8px;"></span>');

  try{
    const photos = await Promise.all(selectedFiles.map(function(file){ return compressImage(file); }));

    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({
        employeeName: employeeName,
        siteName: siteName,
        assetName: assetName,
        status: statusEl.value,
        notes: notes,
        photos: photos
      })
    });
    const data = await res.json();

    if(data.ok){
      formCard.style.display = 'none';
      successCard.style.display = 'block';
      window.scrollTo({top:0, behavior:'smooth'});
    } else {
      showToast(data.error || 'حصل خطأ أثناء الإرسال، حاول تاني', true);
    }
  } catch(err){
    showToast('تعذر الاتصال بالسيرفر، تأكد من الإنترنت وحاول تاني', true);
  } finally {
    submitBtn.disabled = false;
    submitLabel.textContent = 'إرسال التقرير';
    const sp = submitBtn.querySelector('.spinner');
    if(sp) sp.remove();
  }
});

newReportBtn.addEventListener('click', function(){
  const keepEmployee = document.getElementById('employeeName').value;
  const keepSite = document.getElementById('siteName').value;
  form.reset();
  document.getElementById('employeeName').value = keepEmployee;
  document.getElementById('siteName').value = keepSite;
  selectedFiles = [];
  thumbsWrap.innerHTML = '';
  document.querySelectorAll('.status-option').forEach(function(o){o.classList.remove('checked');});
  successCard.style.display = 'none';
  formCard.style.display = 'block';
  window.scrollTo({top:0, behavior:'smooth'});
});

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>
</body>
</html>
